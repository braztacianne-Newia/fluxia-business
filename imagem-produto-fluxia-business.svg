<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <rect width="300" height="250" fill="#0f1a14"/>

  <!-- Grid lines decorativas -->
  <line x1="0" y1="83" x2="300" y2="83" stroke="#1a2e20" stroke-width="0.5"/>
  <line x1="0" y1="166" x2="300" y2="166" stroke="#1a2e20" stroke-width="0.5"/>
  <line x1="100" y1="0" x2="100" y2="250" stroke="#1a2e20" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="250" stroke="#1a2e20" stroke-width="0.5"/>

  <!-- Acento verde esquerdo -->
  <rect x="0" y="0" width="4" height="250" fill="#1D9E75"/>

  <!-- Círculo decorativo -->
  <circle cx="240" cy="200" r="80" fill="none" stroke="#1D9E75" stroke-width="0.5" opacity="0.3"/>
  <circle cx="240" cy="200" r="55" fill="none" stroke="#1D9E75" stroke-width="0.5" opacity="0.2"/>

  <!-- Símbolo F estilizado -->
  <rect x="28" y="34" width="32" height="3" fill="#1D9E75"/>
  <rect x="28" y="34" width="3" height="52" fill="#1D9E75"/>
  <rect x="28" y="55" width="22" height="3" fill="#1D9E75"/>

  <!-- Nome FLUXIA BUSINESS em duas linhas -->
  <text x="72" y="52" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f7f4ef" letter-spacing="5">FLUXIA</text>
  <text x="72" y="72" font-family="Georgia, serif" font-size="11" font-weight="400" fill="#9FE1CB" letter-spacing="5">BUSINESS</text>

  <!-- Linha separadora -->
  <line x1="28" y1="100" x2="272" y2="100" stroke="#1D9E75" stroke-width="0.5" opacity="0.6"/>

  <!-- Tagline -->
  <text x="28" y="122" font-family="Georgia, serif" font-size="11" fill="#9FE1CB" letter-spacing="1" font-style="italic">Automação com IA para pequenos negócios</text>

  <!-- Nome do produto -->
  <text x="28" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#f7f4ef" letter-spacing="0.5">AUTOMAÇÃO INICIAL</text>

  <!-- Bullets -->
  <circle cx="32" cy="174" r="2" fill="#1D9E75"/>
  <text x="40" y="178" font-family="Arial, sans-serif" font-size="9" fill="#8a9e90">Implementação completa com IA</text>

  <circle cx="32" cy="191" r="2" fill="#1D9E75"/>
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="9" fill="#8a9e90">Entrega em até 7 dias úteis</text>

  <circle cx="32" cy="208" r="2" fill="#1D9E75"/>
  <text x="40" y="212" font-family="Arial, sans-serif" font-size="9" fill="#8a9e90">30 dias de suporte incluído</text>

  <!-- Preço -->
  <rect x="188" y="149" width="84" height="36" rx="4" fill="#1D9E75"/>
  <text x="230" y="163" font-family="Arial, sans-serif" font-size="9" fill="#0f1a14" text-anchor="middle" font-weight="600">A PARTIR DE</text>
  <text x="230" y="177" font-family="Georgia, serif" font-size="14" fill="#0f1a14" text-anchor="middle" font-weight="700">R$ 997</text>

  <!-- Rodapé -->
  <line x1="28" y1="232" x2="272" y2="232" stroke="#1a2e20" stroke-width="0.5"/>
  <text x="28" y="244" font-family="Arial, sans-serif" font-size="8" fill="#3a5040" letter-spacing="2">FLUXIABUSINESS.NETLIFY.APP</text>
</svg>
